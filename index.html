    }

    canvas {
        background: #222;

        touch-action: none;
    }
</style>
</head>

<body>

<h1>ブロック崩し</h1>
<div id="score">スコア：0</div>

<canvas id="game"></canvas>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = Math.min(window.innerWidth - 20, 400);

    x: canvas.width / 2,
    y: canvas.height - 80,
    dx: 3,
    dy: -3,
    r: 8
};

    width: 90,

    x: canvas.width / 2 - 45,
    y: canvas.height - 35
};

let gameOver = false;

const rows = 5;
const cols = 6;
const brickWidth = (canvas.width - 40) / cols;
const brickHeight = 22;

let bricks = [];

for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
        bricks.push({
            x: 20 + c * brickWidth,
            y: 40 + r * (brickHeight + 6),
            width: brickWidth - 5,
            height: brickHeight,
            alive: true
        });
    }
}

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.closePath();
}

function drawPaddle() {
    ctx.fillStyle = "white";
    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );
}

function drawBricks() {
    bricks.forEach(brick => {
        if (brick.alive) {
            ctx.fillStyle = "orange";
            ctx.fillRect(
                brick.x,
                brick.y,
                brick.width,
                brick.height
            );
        }
    });
}
