<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブロック崩し</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: sans-serif;
}

h1 {
    margin: 15px 0 5px;
}

#score {
    font-size: 20px;
    margin-bottom: 10px;
}

canvas {
    display: block;
    margin: auto;
    background: #222;
    border: 3px solid white;
    width: 90vw;
    max-width: 400px;
    height: auto;
    touch-action: none;
}
</style>
</head>

<body>

<h1>ブロック崩し</h1>
<div id="score">スコア：0</div>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let ball = {
    x: 200,
    y: 500,
    dx: 3,
    dy: -3,
    r: 8
};

let paddle = {
    x: 155,
    y: 560,
    width: 90,
    height: 12
};

let score = 0;
let gameOver = false;

const rows = 5;
const cols = 6;
const brickWidth = 58;
const brickHeight = 25;

let bricks = [];

for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
        bricks.push({
            x: 20 + col * 63,
            y: 40 + row * 35,
            width: brickWidth,
            height: brickHeight,
            alive: true
        });
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ブロック
    bricks.forEach(brick => {
        if (brick.alive) {
            ctx.fillStyle = "orange";
            ctx.fillRect(
                brick.x,
                brick.y,
                brick.width,
                brick.height
            );
        }
    });

    // ボール
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.closePath();

    // パドル
    ctx.fillStyle = "white";
    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );

    if (!gameOver) {
        update();
        requestAnimationFrame(draw);
    }
}

function update() {

    ball.x += ball.dx;
    ball.y += ball.dy;

    // 左右の壁
    if (
        ball.x + ball.r > canvas.width ||
        ball.x - ball.r < 0
    ) {
        ball.dx *= -1;
    }

    // 上の壁
    if (ball.y - ball.r < 0) {
        ball.dy *= -1;
    }

    // パドル
    if (
        ball.y + ball.r >= paddle.y &&
        ball.y < paddle.y + paddle.height &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.width
    ) {
        ball.dy = -Math.abs(ball.dy);
    }

    // ブロック
    bricks.forEach(brick => {

        if (!brick.alive) return;

        if (
            ball.x > brick.x &&
            ball.x < brick.x + brick.width &&
            ball.y - ball.r < brick.y + brick.height &&
            ball.y + ball.r > brick.y
        ) {
            brick.alive = false;
            ball.dy *= -1;

            score++;

            document.getElementById("score").textContent =
                "スコア：" + score;
        }
    });

    // ゲームオーバー
    if (ball.y > canvas.height + 20) {
        gameOver = true;
        setTimeout(() => {
            alert("ゲームオーバー！\nスコア：" + score);
        }, 100);
    }

    // クリア
    if (bricks.every(brick => !brick.alive)) {
        gameOver = true;
        setTimeout(() => {
            alert("クリア！🎉\nスコア：" + score);
        }, 100);
    }
}

// スマホの指操作
canvas.addEventListener("touchmove", function(e) {

    e.preventDefault();

    const rect = canvas.getBoundingClientRect();

    const touchX =
        e.touches[0].clientX - rect.left;

    const scaleX =
        canvas.width / rect.width;

    paddle.x =
        touchX * scaleX - paddle.width / 2;

    if (paddle.x < 0) {
        paddle.x = 0;
    }

    if (paddle.x + paddle.width > canvas.width) {
        paddle.x = canvas.width - paddle.width;
    }

}, { passive: false });

draw();

</script>

</body>
</html>
