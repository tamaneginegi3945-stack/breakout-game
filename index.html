
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藤原千花ブレイクアウト</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: sans-serif;
}

h1 {
    font-size: 23px;
    margin: 14px 0 5px;
}

#score {
    font-size: 18px;
    margin: 8px;
}

#gameArea {
    position: relative;
    width: 92vw;
    max-width: 400px;
    margin: auto;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    border: 3px solid white;
    background: #222;
    touch-action: none;
}

#overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.72);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

#message {
    font-size: 27px;
    font-weight: bold;
}

#startButton {
    border: none;
    border-radius: 12px;
    background: #ff69a6;
    color: white;
    font-size: 20px;
    font-weight: bold;
    padding: 15px 32px;
}

#startButton:active {
    transform: scale(0.95);
}

#help {
    font-size: 13px;
    color: #ccc;
    margin: 12px;
}
</style>
</head>

<body>

<h1>藤原千花ブレイクアウト</h1>

<div id="score">削ったタイル：0 / 384</div>

<div id="gameArea">

    <canvas id="game" width="400" height="600"></canvas>

    <div id="overlay">
        <div id="message">藤原千花を救出せよ！</div>
        <button id="startButton">スタート</button>
    </div>

</div>

<div id="help">
    指を左右に動かしてパドルを操作しよう！
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const overlay = document.getElementById("overlay");
const message = document.getElementById("message");
const startButton = document.getElementById("startButton");
const scoreDisplay = document.getElementById("score");

const img = new Image();

// GitHubにアップロードした画像
img.src = "https://raw.githubusercontent.com/tamaneginegi3945-stack/breakout-game/main/1793519944115.jpg";

const COLS = 16;
const ROWS = 24;
const TILE_W = 25;
const TILE_H = 25;
const TOTAL = COLS * ROWS;

let tiles = [];
let ball;
let paddle;
let score = 0;
let gameState = "ready";
let animationId = null;
let imageLoaded = false;

// 画像読み込み
img.onload = function() {
    imageLoaded = true;
    draw();
};

img.onerror = function() {
    message.textContent = "画像を読み込めません";
    overlay.style.display = "flex";
    startButton.style.display = "none";
};

// 画像を画面いっぱいに描く
function drawImage() {

    if (!imageLoaded) {
        ctx.fillStyle = "#333";
        ctx.fillRect(0, 0, 400, 600);

        ctx.fillStyle = "white";
        ctx.font = "18px sans-serif";
        ctx.fillText("画像を読み込み中...", 105, 300);

        return;
    }

    const scale = Math.max(
        400 / img.width,
        600 / img.height
    );

    const w = img.width * scale;
    const h = img.height * scale;

    const x = (400 - w) / 2;
    const y = (600 - h) / 2;

    ctx.drawImage(img, x, y, w, h);
}

// タイル作成
function createTiles() {

    tiles = [];

    for (let row = 0; row < ROWS; row++) {

        for (let col = 0; col < COLS; col++) {

            tiles.push({
                x: col * TILE_W,
                y: row * TILE_H,
                alive: true
            });

        }
    }
}

// 初期化
function resetGame() {

    score = 0;

    ball = {
        x: 200,
        y: 500,
        dx: 3,
        dy: -3,
        r: 8
    };

    paddle = {
        x: 155,
        y: 560,
        width: 90,
        height: 12
    };

    createTiles();

    scoreDisplay.textContent =
        "削ったタイル：0 / " + TOTAL;

    draw();
}

// 画面描画
function draw() {

    ctx.clearRect(0, 0, 400, 600);

    // キャラクター画像
    drawImage();

    // 残っているタイルを描画
    tiles.forEach(tile => {

        if (!tile.alive) return;

        ctx.fillStyle = "#34394d";

        ctx.fillRect(
            tile.x,
            tile.y,
            TILE_W,
            TILE_H
        );

        ctx.strokeStyle = "#65708b";
        ctx.lineWidth = 1;

        ctx.strokeRect(
            tile.x,
            tile.y,
            TILE_W,
            TILE_H
        );

    });

    // ボール
    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#fff";
    ctx.shadowColor = "#ff69a6";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.closePath();

    // パドル
    ctx.fillStyle = "#ff69a6";

    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );
}

// ゲーム開始
function startGame() {

    if (!imageLoaded) {
        message.textContent = "画像を読み込み中...";
        return;
    }

    if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    resetGame();

    gameState = "playing";

    overlay.style.display = "none";

    gameLoop();
}

// ゲーム終了
function endGame(result) {

    gameState = result;

    if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    overlay.style.display = "flex";

    if (result === "gameover") {
        message.textContent = "GAME OVER";
    } else {
        message.textContent = "CLEAR!! 🎉";
    }

    startButton.textContent = "もう一度プレイ";

    draw();
}

// ボールとタイルの当たり判定
function hitTile() {

    for (let tile of tiles) {

        if (!tile.alive) continue;

        const hit =
            ball.x + ball.r > tile.x &&
            ball.x - ball.r < tile.x + TILE_W &&
            ball.y + ball.r > tile.y &&
            ball.y - ball.r < tile.y + TILE_H;

        if (hit) {

            tile.alive = false;

            score++;

            scoreDisplay.textContent =
                "削ったタイル：" + score + " / " + TOTAL;

            // ボールの進行方向に応じて反射
            const overlapX = Math.min(
                ball.x + ball.r - tile.x,
                tile.x + TILE_W - (ball.x - ball.r)
            );

            const overlapY = Math.min(
                ball.y + ball.r - tile.y,
                tile.y + TILE_H - (ball.y - ball.r)
            );

            if (overlapX < overlapY) {
                ball.dx *= -1;
            } else {
                ball.dy *= -1;
            }

            return;
        }
    }
}

// 更新
function update() {

    ball.x += ball.dx;
    ball.y += ball.dy;

    // 左右の壁
    if (
        ball.x - ball.r < 0 ||
        ball.x + ball.r > 400
    ) {
        ball.dx *= -1;
    }

    // 上の壁
    if (ball.y - ball.r < 0) {
        ball.dy *= -1;
    }

    // パドル
    if (
        ball.dy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.height &&
        ball.x + ball.r >= paddle.x &&
        ball.x - ball.r <= paddle.x + paddle.width
    ) {

        ball.dy = -Math.abs(ball.dy);

        const hit =
            (ball.x - (paddle.x + paddle.width / 2))
            / (paddle.width / 2);

        ball.dx = hit * 4;

    }

    // タイル
    hitTile();

    // ゲームオーバー
    if (ball.y - ball.r > 600) {
        endGame("gameover");
        return;
    }

    // 全タイル破壊
    if (score >= TOTAL) {
        endGame("clear");
        return;
    }
}

// ゲームループ
function gameLoop() {

    if (gameState !== "playing") return;

    update();

    if (gameState !== "playing") return;

    draw();

    animationId = requestAnimationFrame(gameLoop);
}

// スタートボタン
startButton.addEventListener("click", startGame);

// スマホ操作
canvas.addEventListener("touchmove", function(e) {

    e.preventDefault();

    if (gameState !== "playing") return;

    const rect = canvas.getBoundingClientRect();

    const touchX =
        e.touches[0].clientX - rect.left;

    const scale =
        400 / rect.width;

    paddle.x =
        touchX * scale - paddle.width / 2;

    paddle.x = Math.max(
        0,
        Math.min(400 - paddle.width, paddle.x)
    );

}, { passive: false });

// PCでも操作できる
canvas.addEventListener("mousemove", function(e) {

    if (gameState !== "playing") return;

    const rect = canvas.getBoundingClientRect();

    const mouseX =
        (e.clientX - rect.left) * 400 / rect.width;

    paddle.x = Math.max(
        0,
        Math.min(400 - paddle.width,
            mouseX - paddle.width / 2)
    );

});

// 最初の画面
resetGame();

</script>

</body>
</html>
